<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWASP Top 10 · Learning Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B2D;
    --grid:#1C2C44;
    --panel:#152238;
    --panel-border:#28405E;
    --text:#E8EDF4;
    --muted:#7C93B3;
    --gold:#D4A24C;
    --teal:#4FA8A3;
    --red:#C4553D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 32px);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:720px; margin:0 auto;}

  /* header */
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--teal);
    text-transform:uppercase;
  }
  h1{
    font-family:'IBM Plex Mono', monospace;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.02em;
    margin-top:8px;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin-top:6px;
  }

  /* gauge */
  .gauge{
    margin-top:24px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    padding:16px 18px;
    position:relative;
  }
  .gauge-top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
  }
  .gauge-num{font-size:22px; font-weight:600; color:var(--gold);}
  .gauge-pct{font-size:13px; color:var(--muted);}
  .gauge-bar{
    margin-top:10px;
    height:6px;
    background:var(--grid);
    position:relative;
    overflow:hidden;
  }
  .gauge-fill{
    height:100%;
    background:linear-gradient(90deg, var(--teal), var(--gold));
    width:0%;
    transition:width 0.4s ease;
  }
  .gauge-ticks{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex;
  }
  .gauge-ticks span{flex:1; border-right:1px solid var(--bg);}

  /* filters */
  .filters{
    display:flex; gap:8px; margin-top:20px; flex-wrap:wrap;
  }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:6px 12px;
    border:1px solid var(--panel-border);
    color:var(--muted);
    cursor:pointer;
    background:transparent;
    transition:all 0.15s ease;
  }
  .chip:hover{border-color:var(--teal); color:var(--text);}
  .chip.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#0B1622;
    font-weight:600;
  }

  /* category cards */
  .categories{margin-top:24px; display:flex; flex-direction:column; gap:14px;}
  .cat{
    position:relative;
    border:1px solid var(--panel-border);
    background:var(--panel);
  }
  .cat::before, .cat::after{
    content:"";
    position:absolute;
    width:10px; height:10px;
    border-color:var(--gold);
    opacity:0.7;
  }
  .cat::before{top:-1px; left:-1px; border-top:2px solid var(--gold); border-left:2px solid var(--gold);}
  .cat::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold);}
  .cat.complete::before, .cat.complete::after{border-color:var(--teal); opacity:1;}

  .cat-head{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .cat-id{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px; font-weight:700;
    color:var(--gold);
    min-width:44px;
  }
  .cat-title-block{flex:1;}
  .cat-title{font-size:14px; font-weight:600;}
  .cat-tags{
    display:flex; gap:8px; align-items:center;
    margin-top:4px;
  }
  .tier-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; letter-spacing:0.08em; text-transform:uppercase;
    padding:2px 7px;
    border:1px solid;
  }
  .tier-beginner{color:var(--teal); border-color:var(--teal);}
  .tier-intermediate{color:var(--gold); border-color:var(--gold);}
  .tier-advanced{color:var(--red); border-color:var(--red);}
  .cat-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--muted);
  }
  .chevron{
    font-family:'IBM Plex Mono', monospace;
    color:var(--muted);
    transition:transform 0.2s ease;
    font-size:14px;
  }
  .cat.open .chevron{transform:rotate(90deg);}

  .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; font-weight:700; letter-spacing:0.1em;
    color:var(--teal);
    border:1.5px solid var(--teal);
    padding:2px 8px;
    transform:rotate(-8deg);
    opacity:0;
    transition:opacity 0.3s ease;
    white-space:nowrap;
  }
  .cat.complete .stamp{opacity:1;}

  .cat-items{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.25s ease;
    border-top:1px solid var(--panel-border);
  }
  .cat.open .cat-items{border-top:1px solid var(--panel-border);}
  .cat:not(.open) .cat-items{border-top:none;}

  .item{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 16px 10px 60px;
    font-size:13px;
    border-bottom:1px solid var(--grid);
  }
  .item:last-child{border-bottom:none;}
  .item label{cursor:pointer; line-height:1.4; flex:1;}
  .item.checked label{color:var(--muted); text-decoration:line-through;}

  .box{
    appearance:none; -webkit-appearance:none;
    width:15px; height:15px;
    border:1.5px solid var(--muted);
    background:transparent;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
    margin-top:1px;
  }
  .box:checked{background:var(--teal); border-color:var(--teal);}
  .box:checked::after{
    content:"";
    position:absolute; left:4px; top:1px;
    width:4px; height:8px;
    border:solid #0B1622;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  /* footer */
  .footer{
    margin-top:28px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:var(--muted);
  }
  .reset-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--muted);
    padding:6px 12px;
    cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--red); color:var(--red);}
  .status{font-size:11px; color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Sequential Learning Path · A01–A10</div>
  <h1>OWASP Top 10 Audit</h1>
  <div class="sub">Check off each vulnerability class as you understand and can demonstrate it.</div>

  <div class="gauge">
    <div class="gauge-top">
      <span class="gauge-num" id="gaugeNum">0 / 54</span>
      <span class="gauge-pct" id="gaugePct">0%</span>
    </div>
    <div class="gauge-bar">
      <div class="gauge-fill" id="gaugeFill"></div>
      <div class="gauge-ticks" id="gaugeTicks"></div>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="categories" id="categories"></div>

  <div class="footer">
    <span class="status" id="statusText">loading…</span>
    <button class="reset-btn" id="resetBtn">↺ Reset progress</button>
  </div>
</div>

<script>
const DATA = [
  {id:"A01", title:"Broken Access Control", tier:"beginner", items:[
    "IDOR (Insecure Direct Object Reference)",
    "Path Traversal",
    "Privilege Escalation (vertical/horizontal)",
    "CSRF",
    "Force Browsing to authenticated pages",
    "CORS Misconfiguration",
    "JWT / Token Tampering",
    "Missing Function-Level Access Control"
  ]},
  {id:"A02", title:"Cryptographic Failures", tier:"intermediate", items:[
    "Cleartext Transmission (HTTP, weak TLS)",
    "Hard-coded Credentials/Keys",
    "Weak/Deprecated Algorithms (MD5, SHA1, DES, ECB)",
    "Insufficient Entropy in Key/Token Generation",
    "Improper Certificate Validation",
    "Sensitive Data Cached/Logged Unencrypted"
  ]},
  {id:"A03", title:"Injection", tier:"beginner", items:[
    "SQL Injection",
    "Cross-Site Scripting (XSS)",
    "Command Injection",
    "LDAP Injection",
    "NoSQL Injection",
    "ORM Injection",
    "Expression Language (EL) Injection"
  ]},
  {id:"A04", title:"Insecure Design", tier:"advanced", items:[
    "Missing/Ineffective Threat Modeling",
    "Business Logic Flaws",
    "Trust Boundary Violations",
    "Insecure Credential Storage Architecture",
    "Multi-Tenancy Segregation Flaws"
  ]},
  {id:"A05", title:"Security Misconfiguration", tier:"beginner", items:[
    "Default Accounts/Passwords",
    "Unnecessary Features/Ports/Services Enabled",
    "Verbose Error Messages",
    "Missing Security Headers (CSP, HSTS, X-Frame-Options)",
    "XXE (XML External Entity)",
    "Cloud Storage Misconfiguration"
  ]},
  {id:"A06", title:"Vulnerable and Outdated Components", tier:"beginner", items:[
    "Known CVEs in Libraries/Frameworks",
    "Unsupported/EOL Software Versions",
    "No Dependency Scanning (SCA)",
    "Unpatched CMS Plugins"
  ]},
  {id:"A07", title:"Identification and Authentication Failures", tier:"intermediate", items:[
    "Credential Stuffing / Brute Force (no lockout)",
    "Session Fixation",
    "Weak Password Recovery Flow",
    "Missing/Bypassable MFA",
    "Session ID Exposed in URL",
    "Improper Session Invalidation"
  ]},
  {id:"A08", title:"Software and Data Integrity Failures", tier:"advanced", items:[
    "Insecure Deserialization",
    "Unsigned/Unverified Auto-Updates",
    "Insecure CI/CD Pipeline",
    "Untrusted Data in Build Process"
  ]},
  {id:"A09", title:"Security Logging and Monitoring Failures", tier:"advanced", items:[
    "Insufficient Auth/Access Logging",
    "Logs Not Monitored/Alerted",
    "Sensitive Data Leaked into Logs",
    "No Incident Response Process",
    "Log Injection"
  ]},
  {id:"A10", title:"Server-Side Request Forgery (SSRF)", tier:"advanced", items:[
    "Unvalidated Server-Side URL Fetch",
    "Network Segmentation Bypass via Internal Calls",
    "Cloud Metadata Endpoint Access"
  ]}
];

const STORAGE_KEY = "owasp_top10_audit_progress";
const TOTAL = DATA.reduce((s,c)=>s+c.items.length, 0);

// Load persisted state or default to empty object
let checked = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let openCats = {};
let filter = "all";

function itemKey(catId, idx){ return catId + "-" + idx; }

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
}

function renderFilters(){
  const tiers = [["all","All"],["beginner","Beginner"],["intermediate","Intermediate"],["advanced","Advanced"]];
  const el = document.getElementById("filters");
  el.innerHTML = "";
  tiers.forEach(([key,label])=>{
    const btn = document.createElement("button");
    btn.className = "chip" + (filter===key ? " active" : "");
    btn.textContent = label;
    btn.onclick = ()=>{ filter = key; render(); };
    el.appendChild(btn);
  });
}

function tierClass(tier){
  return "tier-" + tier;
}

function renderCategories(){
  const el = document.getElementById("categories");
  el.innerHTML = "";
  DATA.filter(cat => filter==="all" || cat.tier===filter).forEach(cat=>{
    const checkedCount = cat.items.filter((_,i)=>checked[itemKey(cat.id,i)]).length;
    const isComplete = checkedCount === cat.items.length;
    const isOpen = !!openCats[cat.id];

    const card = document.createElement("div");
    card.className = "cat" + (isOpen?" open":"") + (isComplete?" complete":"");

    const head = document.createElement("div");
    head.className = "cat-head";
    head.onclick = ()=>{ openCats[cat.id] = !openCats[cat.id]; render(); };
    head.innerHTML = `
      <div class="cat-id">${cat.id}</div>
      <div class="cat-title-block">
        <div class="cat-title">${cat.title}</div>
        <div class="cat-tags">
          <span class="tier-badge ${tierClass(cat.tier)}">${cat.tier}</span>
          <span class="stamp">cleared</span>
        </div>
      </div>
      <div class="cat-count">${checkedCount}/${cat.items.length}</div>
      <div class="chevron">▸</div>
    `;
    card.appendChild(head);

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "cat-items";
    itemsWrap.style.maxHeight = isOpen ? (cat.items.length * 45 + 20) + "px" : "0px";

    cat.items.forEach((text, i)=>{
      const key = itemKey(cat.id, i);
      const row = document.createElement("div");
      row.className = "item" + (checked[key] ? " checked" : "");
      const cbId = "cb-" + key;
      row.innerHTML = `
        <input type="checkbox" class="box" id="${cbId}" ${checked[key] ? "checked" : ""}>
        <label for="${cbId}">${text}</label>
      `;
      row.querySelector("input").addEventListener("change", (e)=>{
        if(e.target.checked){ checked[key] = true; } else { delete checked[key]; }
        saveState();
        render();
      });
      itemsWrap.appendChild(row);
    });

    card.appendChild(itemsWrap);
    el.appendChild(card);
  });
}

function renderGauge(){
  const done = Object.keys(checked).length;
  const pct = Math.round((done/TOTAL)*100);
  document.getElementById("gaugeNum").textContent = `${done} / ${TOTAL}`;
  document.getElementById("gaugePct").textContent = `${pct}%`;
  document.getElementById("gaugeFill").style.width = pct + "%";

  const ticks = document.getElementById("gaugeTicks");
  if(ticks.childElementCount === 0){
    for(let i=0;i<20;i++){
      const s = document.createElement("span");
      ticks.appendChild(s);
    }
  }
}

function render(){
  renderFilters();
  renderCategories();
  renderGauge();
}

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Reset all checklist progress?")) return;
  checked = {};
  localStorage.removeItem(STORAGE_KEY);
  render();
});

render();
document.getElementById("statusText").textContent = "saved locally in browser storage";
</script>
</body>
</html>
